<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>달연어</title>
<meta name="description" content="달연어 Dal Yeon-eo — 전시 일정과 링크 모음">
<link rel="icon" type="image/svg+xml" href="images/logo-seal.svg">
<link rel="apple-touch-icon" href="images/logo-seal-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* 색과 글꼴은 작가 홈페이지와 같은 것을 씁니다. 두 페이지가 한 브랜드로 읽히게요. */
  :root{
    --wall:#F4F5F3;      /* 전시장 벽 */
    --ink:#1E2022;       /* 본문 */
    --muted:#767A7E;     /* 캡션, 보조 정보 */
    --line:#DADCD8;      /* 구분선 */
    --accent:#2B3FA0;    /* 울트라마린 */
    --card:#FFFFFF;
    --sans:"IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
    --serif:"Gowun Batang", "Nanum Myeongjo", serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--sans);font-weight:400;color:var(--ink);background:var(--wall);
    line-height:1.6;-webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none !important}
  main{max-width:440px;margin:0 auto;padding:56px 20px 64px}

  /* ---------- 프로필 ---------- */
  .profile{text-align:center;margin-bottom:40px}
  .avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;display:block;
          margin:0 auto 20px;border:1px solid var(--line);background:var(--card)}
  .name{font-family:var(--serif);font-size:27px;line-height:1.25;letter-spacing:.01em}
  .name-en{display:block;font-family:var(--sans);font-weight:300;font-size:13px;
           color:var(--muted);letter-spacing:.06em;margin-top:5px}
  .bio{font-size:15px;line-height:1.75;color:var(--muted);margin-top:14px}

  /* ---------- 월별 일정 ---------- */
  .schedule{margin-bottom:34px}
  .sched-head{display:flex;align-items:baseline;justify-content:space-between;
              gap:12px;padding-bottom:11px;border-bottom:1px solid var(--ink)}
  .sched-head h2{font-family:var(--serif);font-weight:400;font-size:17px;letter-spacing:.01em}
  .month-nav{display:flex;gap:2px;flex-shrink:0}
  .month-nav button{width:32px;height:32px;border:0;background:none;cursor:pointer;
                    color:var(--muted);font:inherit;font-size:17px;line-height:1;border-radius:50%}
  .month-nav button:hover{color:var(--ink);background:#EAEBE8}
  .month-nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .events li{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
  .daycol{width:34px;flex-shrink:0;text-align:center;padding-top:1px}
  .daycol .d{display:block;font-family:var(--serif);font-size:20px;line-height:1.1}
  .daycol .w{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
  .ev-title{font-family:var(--serif);font-size:16px;line-height:1.45}
  .ev-period{font-size:13px;color:var(--ink);margin-top:3px}
  .ev-meta{font-size:13px;color:var(--muted);line-height:1.55;margin-top:1px}
  /* 상태는 색칠한 알약 대신 조용한 글자로 */
  .tag{font-size:12px;letter-spacing:.02em;color:var(--accent);margin-left:7px;white-space:nowrap}
  .done .daycol .d,.done .ev-title,.done .ev-period{color:#9DA0A1}
  .done .ev-meta,.done .daycol .w{color:#AEB1B2}
  .empty{font-size:14px;color:var(--muted);padding:17px 0;border-bottom:1px solid var(--line)}

  /* ---------- 링크 ---------- */
  .links{list-style:none;display:flex;flex-direction:column;gap:9px}
  .pill{display:flex;align-items:center;gap:14px;min-height:62px;padding:13px 16px;
        background:var(--card);border:1px solid var(--line);border-radius:12px;
        text-decoration:none;color:var(--ink);
        transition:border-color .15s, transform .15s}
  .pill:hover{border-color:var(--ink);transform:translateY(-1px)}
  .pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pill .label{flex:1;min-width:0}
  .pill .title{display:block;font-size:15.5px;font-weight:500;line-height:1.4}
  .pill .sub{display:block;font-size:13.5px;font-weight:400;color:var(--muted);
             line-height:1.5;margin-top:2px}
  .pill .go{flex-shrink:0;color:var(--muted);font-size:15px;line-height:1}
  .pill:hover .go{color:var(--ink)}
  .shape,.photo{width:38px;height:38px;flex-shrink:0;display:block}
  .photo{border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--wall)}
  .pill .title,.pill .sub,.pill .shape,.pill .photo,.pill .go{pointer-events:none;user-select:none}

  footer{text-align:center;font-size:12.5px;color:var(--muted);margin-top:44px;letter-spacing:.01em}

  @media (max-width:380px){
    main{padding:44px 16px 56px}
    .name{font-size:25px}
  }
  @media (prefers-reduced-motion:reduce){
    .pill{transition:none}
    .pill:hover{transform:none}
  }
</style>

<!-- 방문 통계(GoatCounter). 쿠키를 쓰지 않고 개인정보를 모으지 않아요.
     통계 보기: https://dalyeoneo.goatcounter.com -->
<script data-goatcounter="https://dalyeoneo.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main>
  <div class="profile">
    <img class="avatar" id="avatar" alt="" hidden>
    <h1 class="name" id="name">달연어<span class="name-en">Dal Yeon-eo</span></h1>
    <p class="bio" id="bio" hidden></p>
  </div>

  <section class="schedule" aria-labelledby="monthTitle" hidden>
    <div class="sched-head">
      <h2 id="monthTitle"></h2>
      <div class="month-nav">
        <button id="prev" type="button" aria-label="이전 달">‹</button>
        <button id="next" type="button" aria-label="다음 달">›</button>
      </div>
    </div>
    <ul class="events" id="events" style="list-style:none"></ul>
  </section>

  <ul class="links" id="links"></ul>

  <footer id="footer"></footer>
</main>

<script>
const DAYS = ["일","월","화","수","목","금","토"];
let PROFILE = { name: "달연어", bio: "", photo: "" };
let LINKS = [];
let SCHEDULE = [];

/* 이 사이트는 주소가 /Dalyeoneo_nook/ 아래에 있어서,
   관리 화면이 저장한 /images/... 주소를 여기에 맞게 바꿔줘요. */
const BASE = location.pathname.replace(/[^/]*$/, "");
function resolve(u) {
  if (!u) return "";
  if (/^(https?:)?\/\//.test(u) || u.startsWith("data:")) return u;
  return BASE + u.replace(/^\//, "");
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const $ = id => document.getElementById(id);

/* ---------- 프로필 ---------- */
function renderProfile() {
  const nm = PROFILE.name || "달연어";
  $("name").innerHTML = esc(nm) + '<span class="name-en">Dal Yeon-eo</span>';
  const bio = $("bio");
  bio.textContent = PROFILE.bio || "";
  bio.hidden = !PROFILE.bio;
  const av = $("avatar");
  const src = resolve(PROFILE.photo);
  if (src) { av.src = src; av.hidden = false; av.alt = nm; }
  else { av.hidden = true; }
  $("footer").textContent = "© " + new Date().getFullYear() + " " + nm + " Dal Yeon-eo";
}

/* ---------- 링크 아이콘 ----------
   아이콘 색은 아래 목록을 위에서부터 차례로 돌려 써요.
   관리 화면에서 '아이콘 색'을 고른 버튼은 그 색으로 고정돼요. */
const PALETTE = [
  { key:"노랑", bg:"#E8B93C" }, { key:"빨강", bg:"#C0392B" },
  { key:"보라", bg:"#6A4FA3" }, { key:"초록", bg:"#3E8E6A" },
  { key:"하늘", bg:"#3E7FA8" }, { key:"주황", bg:"#D1762F" },
];
function pickColor(name, order) {
  return PALETTE.find(p => p.key === String(name || "").trim()) || PALETTE[order % PALETTE.length];
}
/* 홈페이지 톤에 맞춰 도형은 가늘고 조용하게 그려요. */
function shapeIcon(kind, col) {
  const w = inner => `<svg class="shape" viewBox="0 0 38 38" aria-hidden="true">
      <circle cx="19" cy="19" r="18" fill="none" stroke="var(--line)" stroke-width="1"/>${inner}</svg>`;
  const F = col.bg;
  switch (kind) {
    case "세모":   return w(`<path d="M12 26 L19 11 L26 26 z" fill="${F}"/>`);
    case "네모":   return w(`<rect x="12" y="12" width="14" height="14" fill="${F}"/>`);
    case "반원":   return w(`<path d="M11 23 a8 8 0 0 1 16 0 z" fill="${F}"/>`);
    case "부채꼴": return w(`<path d="M12 26 L12 12 a14 14 0 0 1 14 14 z" fill="${F}"/>`);
    case "마름모": return w(`<path d="M19 10 L28 19 L19 28 L10 19 z" fill="${F}"/>`);
    case "엑스":   return w(`<path d="M13.5 13.5 L24.5 24.5 M24.5 13.5 L13.5 24.5" stroke="${F}" stroke-width="2.6" stroke-linecap="round"/>`);
    case "하트":   return w(`<path d="M19 26 C10 20 11.8 13 15.8 13 C17.7 13 19 14.6 19 15.9 C19 14.6 20.3 13 22.2 13 C26.2 13 28 20 19 26 z" fill="${F}"/>`);
    case "도넛":   return w(`<circle cx="19" cy="19" r="7" fill="none" stroke="${F}" stroke-width="3.4"/>`);
    default:       return w(`<circle cx="19" cy="19" r="6.5" fill="${F}"/>`);
  }
}
/* 사진을 올린 버튼은 도형 대신 그 사진을 동그랗게 보여줘요.
   사진 주소가 잘못돼 안 뜨면 원래 도형으로 돌아가요. */
function linkIcon(l, order) {
  const col = pickColor(l.color, order);
  const src = resolve(l.photo);
  if (!src) return shapeIcon(l.shape, col);
  return `<img class="photo" src="${esc(src)}" alt="" loading="lazy"
    onerror="this.outerHTML=this.dataset.fallback" data-fallback="${esc(shapeIcon(l.shape, col))}">`;
}

function renderLinks() {
  $("links").innerHTML = LINKS
    .filter(l => l && l.visible !== false && l.url)
    .map((l, i) => `<li><a class="pill" href="${esc(l.url)}" target="_blank" rel="noopener">
      ${linkIcon(l, i)}<span class="label"><span class="title">${esc(l.title)}</span>${
        l.sub ? `<span class="sub">${esc(l.sub)}</span>` : ""}</span><span class="go">↗</span></a></li>`)
    .join("");
}

/* ---------- 월별 일정 ---------- */
const today = new Date();
let viewY = today.getFullYear(), viewM = today.getMonth();

function d10(v) { return typeof v === "string" ? v.slice(0, 10) : ""; }
function endOf(e) { const en = d10(e.end); return en && en >= d10(e.date) ? en : d10(e.date); }

/* 일정이 걸쳐 있는 달을 모두 모아요. 여러 달에 걸친 전시도 빠짐없이 세요. */
function monthsWithEvents() {
  const set = new Set();
  for (const e of SCHEDULE) {
    const s = d10(e && e.date); if (!s) continue;
    const en = endOf(e) || s;
    let y = +s.slice(0, 4), m = +s.slice(5, 7);
    const ey = +en.slice(0, 4), em = +en.slice(5, 7);
    let guard = 0;
    while ((y < ey || (y === ey && m <= em)) && guard++ < 240) {
      set.add(`${y}-${String(m).padStart(2, "0")}`);
      if (++m > 12) { m = 1; y++; }
    }
  }
  return [...set].sort();
}

/* 처음 열었을 때 보여줄 달.
   이 달에 일정이 있으면 이 달, 없으면 가장 가까운 앞으로의 달,
   그것도 없으면 일정이 있던 마지막 달을 엽니다.
   처음 온 사람에게 "일정 없음"이 먼저 보이지 않게 하려는 거예요. */
function pickStartMonth() {
  const months = monthsWithEvents();
  if (!months.length) return null;
  const now = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;
  return months.find(m => m >= now) || months[months.length - 1];
}

function renderMonth() {
  $("monthTitle").textContent = `${viewY}년 ${viewM + 1}월`;
  const mm = String(viewM + 1).padStart(2, "0");
  const first = `${viewY}-${mm}-01`, last = `${viewY}-${mm}-31`;
  const list = SCHEDULE
    .filter(e => e && d10(e.date) && d10(e.date) <= last && endOf(e) >= first)
    .sort((a, b) => d10(a.date).localeCompare(d10(b.date)));

  const ul = $("events");
  if (!list.length) { ul.innerHTML = `<li class="empty">이 달에는 일정이 없어요.</li>`; return; }

  const todayISO = new Date().toISOString().slice(0, 10);
  ul.innerHTML = list.map(e => {
    const s0 = new Date(d10(e.date) + "T00:00:00"), e0 = new Date(endOf(e) + "T00:00:00");
    const ranged = endOf(e) !== d10(e.date);

    let cls = "", tag = "";
    if (endOf(e) < todayISO) cls = "done";
    else if (d10(e.date) <= todayISO) tag = `<span class="tag">${ranged ? "진행 중" : "오늘"}</span>`;
    else {
      const left = Math.round((s0 - new Date(todayISO + "T00:00:00")) / 86400000);
      if (left <= 7) tag = `<span class="tag">${left}일 뒤</span>`;
    }

    const sameMonth = s0.getMonth() === e0.getMonth();
    const period = ranged
      ? `<div class="ev-period">${s0.getMonth() + 1}월 ${s0.getDate()}일 – ${sameMonth ? "" : (e0.getMonth() + 1) + "월 "}${e0.getDate()}일</div>`
      : "";

    return `<li class="${cls}">
      <div class="daycol"><span class="d">${s0.getDate()}</span><span class="w">${DAYS[s0.getDay()]}</span></div>
      <div><div class="ev-title">${esc(e.title)}${tag}</div>${period}
      ${e.meta ? `<div class="ev-meta">${esc(e.meta)}</div>` : ""}</div></li>`;
  }).join("");
}

$("prev").addEventListener("click", () => { if (--viewM < 0) { viewM = 11; viewY--; } renderMonth(); });
$("next").addEventListener("click", () => { if (++viewM > 11) { viewM = 0; viewY++; } renderMonth(); });

/* ---------- 관리 화면에서 저장한 내용 불러오기 ---------- */
async function load() {
  try {
    const res = await fetch(BASE + "content/linkpage.json?v=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    if (d.name || d.bio || d.photo) PROFILE = { name: d.name || "", bio: d.bio || "", photo: d.photo || "" };
    LINKS = Array.isArray(d.links) ? d.links : [];
    SCHEDULE = Array.isArray(d.schedule) ? d.schedule : [];
  } catch (err) {
    console.warn("내용을 불러오지 못했어요:", err.message);
  }
  renderProfile();
  renderLinks();

  const start = pickStartMonth();
  const sec = document.querySelector(".schedule");
  if (start) {
    viewY = +start.slice(0, 4);
    viewM = +start.slice(5, 7) - 1;
    sec.hidden = false;
  } else {
    sec.hidden = true;     /* 일정이 하나도 없으면 빈 칸을 보여주지 않아요 */
  }
  renderMonth();
}

load();
</script>
</body>
</html>
