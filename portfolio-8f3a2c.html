<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>달연어 포트폴리오</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     포트폴리오 (PDF 저장용)
     - 이 페이지는 사이트 어디에도 링크되어 있지 않고, 검색엔진에도 잡히지 않습니다.
     - 작품·이력·사이트 정보는 data/site.json 을 읽어 자동으로 채워집니다.
     - 가격은 넣지 않습니다.
     ============================================================ */
  :root{
    --ink:#1E2022; --muted:#767A7E; --line:#DADCD8;
    --sans:"IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
    --serif:"Gowun Batang", "Nanum Myeongjo", serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#8A8D88;color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.75;
       -webkit-font-smoothing:antialiased}
  img{max-width:100%}

  /* 화면에서는 A4 종이가 놓인 것처럼 보여요 */
  .page{width:210mm;min-height:297mm;padding:22mm 20mm;margin:0 auto 14px;background:#fff;
        display:flex;flex-direction:column;position:relative;overflow:hidden}

  .bar{position:sticky;top:0;z-index:10;background:#2A2C2E;color:#fff;padding:14px 20px;
       display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px}
  .bar button{font:inherit;font-size:14px;background:#fff;color:#1E2022;border:0;border-radius:3px;
              padding:9px 20px;cursor:pointer}
  .bar button:hover{background:#E7E8E5}
  .bar .hint{color:#B9BCC0;font-size:13px}

  /* 표지 */
  .cover{justify-content:center;align-items:center;text-align:center;padding-bottom:34mm}
  .cover .name{font-family:var(--serif);font-size:30px;line-height:1.4;margin:0}
  .cover .name span{display:block;font-family:var(--sans);font-size:15px;color:var(--muted);margin-top:8px;letter-spacing:.04em}
  .cover .intro{font-size:14px;line-height:2.1;max-width:150mm;margin:18px auto 0;color:var(--ink);word-break:keep-all}
  .cover .cover-art{margin:14mm 0 0;max-height:126mm}
  .cover .cover-art img{max-height:126mm;width:auto;display:block;margin:0 auto}
  .cover .foot{position:absolute;left:20mm;right:20mm;bottom:18mm;font-size:12px;color:var(--muted);
               display:flex;justify-content:space-between}

  h2{font-family:var(--sans);font-weight:400;font-size:15px;letter-spacing:.02em;margin:0 0 10mm;
     padding-bottom:4mm;border-bottom:1px solid var(--line)}

  .statement p{font-family:var(--serif);font-size:15px;line-height:2.1;margin:0 0 1.3em;white-space:pre-line}

  /* 작품 한 장에 한 점 */
  .work-art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin-bottom:9mm}
  .work-art img{max-height:180mm;width:auto;object-fit:contain}
  .work-art .no-photo{width:110mm;height:140mm;background:#EDEEEB}
  .cap .t{font-family:var(--serif);font-size:17px;line-height:1.5;margin:0 0 3px}
  .cap .t i{font-style:normal;font-family:var(--sans);font-size:13px;color:var(--muted)}
  .cap p{margin:0;font-size:13px;color:var(--muted);line-height:1.85}
  .cap .desc{margin-top:6px;color:var(--ink);font-size:13px;max-width:150mm}
  .cap .shown{margin-top:6px;font-size:12px}

  /* 이력 */
  .cv-group{margin-bottom:11mm;break-inside:avoid}
  .page.flow{min-height:0}          /* 이력처럼 길이가 늘어나는 쪽 */
  .cv-group h3{font-size:13px;font-weight:500;margin:0 0 4mm}
  .cv-list{list-style:none;margin:0;padding:0;font-size:12.5px}
  .cv-list li{display:grid;grid-template-columns:16mm 1fr;gap:4mm;padding:2.5mm 0;
              border-top:1px solid var(--line);line-height:1.65;break-inside:avoid}
  .cv-list .y{color:var(--muted);font-variant-numeric:tabular-nums}
  .cv-list .title{display:block}
  .cv-list .place{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
  .cv-list.edu li{grid-template-columns:16mm 9mm 9mm 1fr;gap:3mm}

  .contact{font-size:13px}
  .contact dt{color:var(--muted);font-size:12px;margin-top:6mm}
  .contact dd{margin:2px 0 0}
  .contact a{color:inherit}

  .cap .link{margin-top:6px;font-size:12px}
  .cap .link a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}

  /* 작품 고르기 (화면에서만 보이고 PDF에는 안 나와요) */
  .picker{max-width:210mm;margin:0 auto 14px;background:#fff;padding:18px 20px 20px}
  .picker h2{font-size:14px;font-weight:500;margin:0 0 4px;padding:0;border:0}
  .picker .lead{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.7}
  .picker .cats{display:flex;flex-wrap:wrap;gap:18px}
  .picker .cat{min-width:150px;flex:1}
  .picker .cat h3{font-size:12.5px;font-weight:500;margin:0 0 6px;color:var(--muted)}
  .picker label{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;line-height:1.6;
                padding:3px 0;cursor:pointer}
  .picker label input{margin:4px 0 0}
  .picker label .yr{color:var(--muted);font-size:11.5px}
  .picker .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;
                border-top:1px solid var(--line);padding-top:14px}
  .picker .acts button{font:inherit;font-size:12.5px;background:#fff;border:1px solid var(--line);
                       border-radius:3px;padding:7px 14px;cursor:pointer}
  .picker .acts button:hover{border-color:#8A8D88}
  .picker .picked{font-size:12.5px;color:var(--muted);margin-left:auto}
  @media print{ .picker{display:none} }

  .loading{padding:40mm 0;text-align:center;color:var(--muted);font-size:14px}

  /* 인쇄 / PDF 저장 */
  @page{size:A4;margin:0}
  @media print{
    body{background:#fff}
    .bar{display:none}
    .page{margin:0;box-shadow:none;page-break-after:always;break-after:page}
    .page:last-child{page-break-after:auto;break-after:auto}
  }
  @media screen{
    .page{box-shadow:0 10px 30px -18px rgba(0,0,0,.5)}
  }
  /* 좁은 화면에서도 읽을 수 있게 */
  @media screen and (max-width:230mm){
    .page{width:100%;min-height:0;padding:28px 22px}
    .cover{padding-top:60px}
    .cover .foot{position:static;margin-top:40px}
    .work-art img,.cover .cover-art img{max-height:60vh}
  }
</style>
</head>
<body>

<div class="bar">
  <button type="button" id="printBtn">PDF로 저장하기</button>
  <span class="hint">저장 창이 열리면 프린터를 ‘PDF로 저장’으로 고르세요.</span>
</div>

<div class="picker" id="picker"></div>
<div id="out"><p class="loading">포트폴리오를 준비하고 있어요…</p></div>

<script>
(async () => {
const DATA = await fetch("data/site.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : null).catch(() => null);
const out = document.getElementById("out");
if(!DATA){ out.innerHTML = `<p class="loading">작품 정보를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</p>`; return; }

const listOf = v => Array.isArray(v) ? v : (v && typeof v === "object" ? Object.values(v) : []);
const entries = v => listOf(v).map(e => (e && e.data) ? { ...e.data, _file: e._file } : e).filter(Boolean);
const clean = v => (v === undefined || v === null || (typeof v === "string" && !v.trim())) ? "" : v;
const localPath = p => clean(p) ? String(p).replace(/^\/+/, "") : "";
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const yearKey = y => { const [a,b] = String(y ?? "").split(/[.\-\/]/); return (parseInt(a)||0)*100 + (parseInt(b)||0); };
const byYearDesc = (a,b) => (yearKey(b._y) - yearKey(a._y)) || String(b._file||"").localeCompare(String(a._file||""));

const P = (DATA.profile && typeof DATA.profile === "object") ? DATA.profile : {};
const pv = k => String(clean(P[k])).trim();
const nameKo = pv("name_ko") || "달연어", nameEn = pv("name_en") || "Dal Yeon-eo";

/* ---------- 작품 ---------- */
const works = entries(DATA.works).map(r => {
  const wk = {
    title: clean(r.title) || "제목 없음", year: String(clean(r.year)), cat: clean(r.cat) || "회화",
    medium: clean(r.medium), w: +r.w || 0, h: +r.h || 0, d: +r.d || 0,
    edition: clean(r.edition), desc: clean(r.desc), number: String(clean(r.number)).trim(),
    size: String(clean(r.size_text)).trim(), duration: clean(r.duration),
    image: localPath(r.image), featured: r.featured === true || r.featured === "true",
    video: String(clean(r.video)).trim(),
    exhibited: listOf(r.exhibited).map(x => String(x).trim()).filter(Boolean),
  };
  wk._y = wk.year; wk._file = r._file;
  return wk;
}).sort(byYearDesc);
const fi = works.findIndex(w => w.featured);
if(fi > 0) works.unshift(works.splice(fi, 1)[0]);

/* ---------- 전시·학력 ---------- */
const shows = entries(DATA.exhibitions).map(r => ({
  y: String(clean(r.year)), title: clean(r.title) || "", place: clean(r.place), city: clean(r.city),
  type: clean(r.type), _y: String(clean(r.year)), _file: r._file,
})).sort(byYearDesc);
const cv = [
  { group:"학력", items: entries(DATA.education).map(r => ({
      y: String(clean(r.year)), status: clean(r.status), degree: clean(r.degree),
      title: clean(r.school), _y: String(clean(r.year)), _file: r._file,
    })).sort(byYearDesc) },
  { group:"개인전", items: shows.filter(s => s.type === "개인전") },
  { group:"기획・그룹전", items: shows.filter(s => s.type !== "개인전") },
];
const findShow = key => shows.find(s => s.title && key && s.title.includes(key));

/* ---------- 조각들 ---------- */
function sizeText(wk){
  if(wk.size) return wk.size;
  if(wk.duration) return wk.duration;
  if(!wk.w || !wk.h) return "";
  return wk.d ? `${wk.h} × ${wk.w} × ${wk.d} cm` : `${wk.h} × ${wk.w} cm`;
}
function capHTML(wk){
  const size = sizeText(wk);
  const ex = wk.exhibited.map(k => { const it = findShow(k); return it ? `${it.title}${it.y ? ` (${it.y})` : ""}` : k; });
  return `<div class="cap">
    <p class="t">${esc(wk.title)}, <i>${esc(wk.year)}</i></p>
    ${wk.medium ? `<p>${esc(wk.medium)}</p>` : ""}
    ${size ? `<p>${esc(size)}</p>` : ""}
    ${wk.edition ? `<p>${esc(wk.edition)}</p>` : ""}
    ${wk.desc ? `<p class="desc">${esc(wk.desc)}</p>` : ""}
    ${ex.length ? `<p class="shown">출품 전시 ${ex.map(esc).join(" / ")}</p>` : ""}
    ${wk.video ? `<p class="link">영상 보기 <a href="${esc(wk.video)}">${esc(shortUrl(wk.video))}</a></p>` : ""}
  </div>`;
}
/* 영상 주소는 보기 좋게 줄여서 보여주고, 누르면 그 주소로 가요 */
function shortUrl(u){ return String(u).replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/$/, ""); }

/* 소개 문구는 '질문을' 뒤에서 줄을 바꿔요. 그 말이 없으면 한 줄로 흘러가요. */
function introHTML(t){
  const at = t.indexOf("질문을");
  if(at < 0) return esc(t);
  const cut = at + "질문을".length;
  return esc(t.slice(0, cut)) + "<br>" + esc(t.slice(cut).replace(/^\s+/, ""));
}
const artHTML = wk => wk.image
  ? `<img src="${esc(wk.image)}" alt="${esc(wk.title)}">`
  : `<div class="no-photo" role="img" aria-label="${esc(wk.title)} (사진 없음)"></div>`;

/* ---------- 어떤 작품을 넣을지 고르기 ----------
   처음 열면 분류마다 최근 작품이 자동으로 골라져요(회화 4점, 나머지 3점).
   고른 내용은 주소에 담겨서, 용도별로 즐겨찾기에 저장해 둘 수 있어요. */
const CAT_ORDER = ["회화", "입체", "디지털 드로잉", "그래픽", "미디어 영상"];
const DEFAULT_MAX = { "회화": 4 };
const MAX_ETC = 3;
const keyOf = wk => wk.number || wk._file || wk.title;

function defaultPicked(){
  const count = {};
  return works.filter(wk => {
    const max = DEFAULT_MAX[wk.cat] || MAX_ETC;
    count[wk.cat] = (count[wk.cat] || 0) + 1;
    return count[wk.cat] <= max;
  }).map(keyOf);
}
function readPicked(){
  const q = new URLSearchParams(location.search).get("w");
  if(q === null) return defaultPicked();
  if(!q.trim()) return [];
  const want = q.split(",").map(x => decodeURIComponent(x.trim())).filter(Boolean);
  return works.filter(wk => want.includes(keyOf(wk))).map(keyOf);
}
let picked = new Set(readPicked());

function saveToUrl(){
  const q = [...picked].map(encodeURIComponent).join(",");
  history.replaceState({}, "", location.pathname + (q ? "?w=" + q : "?w="));
}

/* ---------- 고르는 칸 그리기 ---------- */
function renderPicker(){
  const cats = CAT_ORDER.filter(c => works.some(wk => wk.cat === c));
  document.getElementById("picker").innerHTML = `
    <h2>포트폴리오에 넣을 작품</h2>
    <p class="lead">보낼 곳에 맞게 골라 주세요. 고른 내용은 주소에 저장돼요.
      자주 쓰는 조합은 그 주소를 즐겨찾기에 넣어 두면 다음에 그대로 열려요.
      이 칸은 PDF에는 나오지 않아요.</p>
    <div class="cats">
      ${cats.map(c => `<div class="cat"><h3>${esc(c)}</h3>
        ${works.filter(wk => wk.cat === c).map(wk => `
          <label><input type="checkbox" value="${esc(keyOf(wk))}"${picked.has(keyOf(wk)) ? " checked" : ""}>
          <span>${esc(wk.title)} <span class="yr">${esc(wk.year)}</span></span></label>`).join("")}
      </div>`).join("")}
    </div>
    <div class="acts">
      <button type="button" data-act="default">기본으로 (회화 4, 나머지 3)</button>
      <button type="button" data-act="all">모두 넣기</button>
      <button type="button" data-act="none">모두 빼기</button>
      <span class="picked">고른 작품 ${picked.size} / ${works.length}</span>
    </div>`;
}
document.getElementById("picker").addEventListener("change", e => {
  const box = e.target.closest("input[type=checkbox]"); if(!box) return;
  if(box.checked) picked.add(box.value); else picked.delete(box.value);
  saveToUrl(); renderPicker(); renderPages();
});
document.getElementById("picker").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if(!b) return;
  if(b.dataset.act === "default") picked = new Set(defaultPicked());
  if(b.dataset.act === "all") picked = new Set(works.map(keyOf));
  if(b.dataset.act === "none") picked = new Set();
  saveToUrl(); renderPicker(); renderPages();
});

/* ---------- 쪽 만들기 ---------- */
function renderPages(){
const chosen = works.filter(wk => picked.has(keyOf(wk)));
const pages = [];

/* 표지: 고른 작품 중 대표작, 없으면 첫 작품 */
const cover = chosen.find(wk => wk.featured) || chosen[0];
pages.push(`<section class="page cover">
  <h1 class="name">${esc(nameKo)}<span>${esc(nameEn)}</span></h1>
  ${pv("intro") ? `<p class="intro">${introHTML(pv("intro"))}</p>` : ""}
  ${cover ? `<div class="cover-art">${artHTML(cover)}</div>` : ""}
  <div class="foot"><span>Portfolio</span><span id="coverDate"></span></div>
</section>`);

/* 작가 노트 */
if(pv("statement")){
  const paras = pv("statement").replace(/\r\n?/g, "\n").split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  pages.push(`<section class="page">
    <h2>작가 노트</h2>
    <div class="statement">${paras.map(p => `<p>${esc(p)}</p>`).join("")}</div>
  </section>`);
}

/* 작품 (한 장에 한 점) */
chosen.forEach(wk => {
  pages.push(`<section class="page">
    <div class="work-art">${artHTML(wk)}</div>
    ${capHTML(wk)}
  </section>`);
});

/* 이력 */
const cvHTML = cv.filter(g => g.items.length).map(g => {
  const edu = g.items.some(it => it.status || it.degree);
  if(edu){
    return `<div class="cv-group"><h3>${g.group}</h3><ul class="cv-list edu">
      ${g.items.map(it => `<li><span class="y">${esc(it.y)}</span><span>${esc(it.status||"")}</span><span>${esc(it.degree||"")}</span><span class="title">${esc(it.title)}</span></li>`).join("")}
    </ul></div>`;
  }
  return `<div class="cv-group"><h3>${g.group}</h3><ul class="cv-list">
    ${g.items.map((it,i) => {
      const same = i > 0 && g.items[i-1].y === it.y;
      const where = [it.place, it.city].filter(Boolean).join(", ");
      return `<li><span class="y">${same ? "" : esc(it.y)}</span><span><span class="title">${esc(it.title)}</span>${where ? `<span class="place">${esc(where)}</span>` : ""}</span></li>`;
    }).join("")}
  </ul></div>`;
}).join("");

const mail = pv("email") || "chicdotori00@gmail.com";
const insta = (pv("instagram") || "dal_yeoneo_nook").replace(/^https?:\/\/(www\.)?instagram\.com\//, "").replace(/^@/, "").replace(/\/.*$/, "");
pages.push(`<section class="page flow">
  <h2>이력</h2>
  ${cvHTML || `<p class="loading">이력이 아직 없습니다.</p>`}
</section>`);

pages.push(`<section class="page">
  <h2>연락</h2>
  <dl class="contact">
    <dt>이메일</dt><dd><a href="mailto:${esc(mail)}">${esc(mail)}</a></dd>
    <dt>인스타그램</dt><dd><a href="https://www.instagram.com/${encodeURIComponent(insta)}/">@${esc(insta)}</a></dd>
    <dt>웹사이트</dt><dd><a href="https://dalyeoneo-cmd.github.io/Dalyeoneo_nook/">dalyeoneo-cmd.github.io/Dalyeoneo_nook</a></dd>
  </dl>
  <p style="margin-top:14mm;font-size:11.5px;color:var(--muted)">© ${new Date().getFullYear()} ${esc(nameKo)} ${esc(nameEn)}. 모든 작품 이미지의 저작권은 작가에게 있습니다.</p>
</section>`);

out.innerHTML = pages.join("");

const d = new Date();
document.getElementById("coverDate").textContent = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}`;
document.title = `${nameKo} 포트폴리오 ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}`;
}

saveToUrl();
renderPicker();
renderPages();
document.getElementById("printBtn").addEventListener("click", () => window.print());
})();
</script>
</body>
</html>
